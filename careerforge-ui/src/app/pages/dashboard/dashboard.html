<div class="dashboard">

  <!-- Header -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">✦</span>
      <span>CareerForge</span>
    </div>

    <div class="user-section">
      <span>{{ userName }}</span>
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </header>

  <!-- Main content -->
  <main class="content">

    <section class="hero">
      <div>
        <p class="eyebrow">YOUR CAREER, FORGED WITH AI</p>
        <h1>Build your next career move.</h1>
        <p class="subtitle">
          Analyze your resume, discover skill gaps, and get personalized
          career recommendations.
        </p>
      </div>

      <div class="hero-icon">
        ✦
      </div>
    </section>

    <!-- Main actions -->
    <section class="action-grid">

      <div class="action-card">
        <div class="card-icon">📄</div>

        <div>
          <h2>My Resume</h2>
          <p>Upload and manage your resumes.</p>
        </div>

        <button class="primary-btn" routerLink="/resume">
          Manage Resume →
        </button>
      </div>

      <div class="action-card">
        <div class="card-icon">💼</div>

        <div>
          <h2>Job Match</h2>
          <p>Find jobs that match your profile.</p>
        </div>

        <button class="primary-btn" routerLink="/job-match">
          Find Jobs →
        </button>
      </div>

    </section>

    <!-- Career snapshot feature removed -->

  </main>

</div>
